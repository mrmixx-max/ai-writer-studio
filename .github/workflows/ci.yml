name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    name: Typecheck · Lint · Test (+Coverage) · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (legacy-peer-deps, Tauri-Projekt mit Pinning)
        run: npm ci --legacy-peer-deps

      - name: Security Audit (npm audit)
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit-Tests mit Coverage-Gates (services ≥ 80 %, components ≥ 60 %)
        run: npm run test:coverage

      - name: Upload Coverage-Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14

      - name: Build (Frontend)
        run: npm run build

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Security Audit (npm audit)
        run: npm audit --audit-level=high

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E-Tests (Vite-Dev-Server, In-Memory-DB)
        run: npx playwright test

      - name: Upload Playwright-Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  tauri:
      name: Tauri Build (Windows)
      runs-on: windows-latest
      steps:
        - uses: actions/checkout@v4

        - uses: dtolnay/rust-toolchain@stable
          with:
            targets: x86_64-pc-windows-msvc

        - uses: actions/setup-node@v4
          with:
            node-version: 22
            cache: npm

        - name: Install dependencies
          run: npm ci --legacy-peer-deps
          working-directory: ./src-tauri

        - name: Cargo Security Audit
          run: |
            cargo install cargo-audit
            cargo audit
          working-directory: ./src-tauri

        - name: Build Tauri App
          uses: tauri-apps/tauri-action@v0
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          with:
            tagName: v__VERSION__
            releaseName: 'AI Writer Studio v__VERSION__'
            releaseBody: 'See the assets to download this version and install.'
            releaseDraft: true
            prerelease: false
            args: --target x86_64-pc-windows-msvc
