# docker-compose.yml — Sprint 6, Agent 4
# AI Writer Studio v1.4.0: Web-UI + lokale DB + isolierte Ollama-Instanz.
#
# Start:        docker compose up -d
# Studio:       http://localhost:8080
# Ollama API:   http://localhost:11434 (intern: http://ollama:11434)
#
# Hinweise:
# - Die App läuft als statischer Vite-Build (dist/) hinter Caddy; die
#   Browser-App spricht Ollama direkt über den Browser-Fetch (CORS via
#   OLLAMA_ORIGINS) — kein Server-Proxy nötig, siehe src/services/llm/ollama.ts.
# - Ollama ist bewusst isoliert: eigenes Netz (ollama-net), eigene Daten-
#   Volume (ollama-data), keine Abhängigkeit vom Studio-Netzverkehr.
# - Persistenz: Projekt-DB (sql.js/SQLite-Dateien) unter ./data/db,
#   App-Logs (app-2026-09.log …) unter ./data/logs.
# - Security: Non-root containers, read-only rootfs, dropped capabilities, resource limits.

services:
  # ── AI Writer Studio (statischer Vite-Build + Reverse-Proxy) ──────────
  studio:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-writer-studio:1.4.0
    container_name: ai-writer-studio
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      # Projekt-Datenbanken (sql.js persistierte SQLite-Dateien)
      - ./data/db:/data/db
      # Rotierende Logdateien (app-YYYY-MM.log)
      - ./data/logs:/data/logs
    environment:
      # Produktion: Konsolen-Logging aus, Datei-Rotation an
      - NODE_ENV=production
      - LOG_DIR=/data/logs
      - LOG_MAX_FILE_BYTES=5242880
      - LOG_MAX_FILES_PER_MONTH=10
      # App erreicht Ollama im Browser über den Host-Port
      - VITE_OLLAMA_BASE_URL=http://localhost:11434
    depends_on:
      ollama:
        condition: service_started
    networks:
      - studio-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Security Hardening
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/run
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  # ── Ollama (isolierte lokale LLM-Instanz) ─────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ai-writer-studio-ollama
    restart: unless-stopped
    # KEIN Host-Port Mapping — nur intern über Compose-Netz erreichbar
    # Browser-App nutzt VITE_OLLAMA_BASE_URL=http://localhost:11434
    # → Host-Mapping nur temporär für Debugging: - "127.0.0.1:11434:11434"
    ports: []
    volumes:
      - ollama-data:/root/.ollama
    environment:
      # CORS: Die Studio-Web-App (http://localhost:8080) darf direkt
      # /api/tags und /api/chat vom Browser aus aufrufen.
      - OLLAMA_ORIGINS=http://localhost:8080,http://localhost,app://.
      - OLLAMA_KEEP_ALIVE=10m
      - OLLAMA_NUM_PARALLEL=1
    networks:
      - ollama-net
    # Optional: GPU-Freigabe (NVIDIA) — Kommentar entfernen, falls verfügbar
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    # Security Hardening
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '1.0'
          memory: 2G

volumes:
  ollama-data:
    name: ai-writer-studio-ollama-data

networks:
  studio-net:
    name: ai-writer-studio-net
  ollama-net:
    name: ai-writer-studio-ollama-net
    internal: false # Browser-Zugriff via Host-Port 11434 (nur bei ports-Mapping)
