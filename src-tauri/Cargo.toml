[package]
name = "ai-writer-studio"
version = "1.0.0"
description = "AI Writer Studio - Lokales Manuskriptstudio mit KI"
authors = ["Erik Gieske"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `path` ist Teil des tauri-Core-Crates — es gibt kein separates tauri-plugin-path.
# Kein `protocol-asset`: die App lädt keine Dateien über asset:-URLs, und das
# Feature verlangt einen korrespondierenden assetProtocol-Block in tauri.conf.json.
tauri = { version = "2.2.0", features = [] }
tauri-plugin-dialog = "2.2.0"
tauri-plugin-fs = "2.2.0"
tauri-plugin-process = "2.2.0"
tauri-plugin-shell = "2.2.0"
tauri-plugin-updater = "2.2.0"
# Verhindert parallele Instanzen: ein zweiter Start leitet an die bestehende
# Instanz weiter (Fokus statt Zombie). Verbraucht die WebView2-UDF nicht.
tauri-plugin-single-instance = "2"
# Structured Logging mit Datei-Appender für Release-Diagnostics.
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
log = "0.4"

[features]
default = []

# Release-Profil: kleine, schnelle Binärdatei ohne Debug-Ballast.
[profile.release]
panic = "abort"      # keine Unwind-Tabellen
codegen-units = 1    # bessere Optimierung
lto = true           # Link-Time-Optimization
opt-level = "s"      # auf Größe optimieren
strip = true         # Symbole entfernen
